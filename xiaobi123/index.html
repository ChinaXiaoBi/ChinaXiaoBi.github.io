<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>教师节快乐 · 惊喜盲盒</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--gold:#f5c842;--red:#e74c3c;--pink:#ff6b9d;--purple:#9b59b6;--blue:#3498db;--green:#2ecc71;--orange:#f39c12;--bg1:#1a1a2e;--bg2:#16213e;--bg3:#0f3460}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg1);color:#fff}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--d,3s) ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.page{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .6s ease}
.page.active{opacity:1;pointer-events:auto}
#paper-stage{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;perspective:1200px;background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3))}
.paper{width:min(85vw,420px);height:min(60vh,560px);background:linear-gradient(145deg,#fffdf5,#f5f0e0);border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.05);position:relative;transform-style:preserve-3d;animation:paperDrop 2.2s cubic-bezier(.22,1,.36,1) forwards;opacity:0}
@keyframes paperDrop{0%{opacity:0;transform:translateY(-120vh) rotateX(60deg) rotateZ(-15deg) scale(.6)}15%{opacity:1}40%{transform:translateY(10vh) rotateX(30deg) rotateZ(8deg) scale(.95)}55%{transform:translateY(-5vh) rotateX(10deg) rotateZ(-4deg) scale(1)}70%{transform:translateY(2vh) rotateX(3deg) rotateZ(1deg) scale(1)}85%{transform:translateY(0) rotateX(0) rotateZ(0) scale(1)}100%{opacity:1;transform:translateY(0) rotateX(0) rotateZ(0) scale(1)}}
.paper::before{content:'';position:absolute;inset:0;border-radius:6px;background:repeating-linear-gradient(0deg,transparent,transparent 28px,rgba(200,180,140,.15) 28px,rgba(200,180,140,.15) 29px);pointer-events:none}
.paper-content{padding:40px 30px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#5a4a3a;position:relative;z-index:1}
.paper-content .emoji{font-size:3.5rem;margin-bottom:16px;animation:bounce 1s ease infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.paper-content h2{font-size:1.8rem;color:#8b4513;margin-bottom:12px;letter-spacing:2px}
.paper-content p{font-size:1rem;color:#a08060;line-height:1.8}
.paper-content .tap-hint{margin-top:30px;font-size:.85rem;color:#b09070;animation:pulse 1.5s ease infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
#greetings-page{background:linear-gradient(180deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%)}
.greetings-header{text-align:center;margin-bottom:30px;flex-shrink:0}
.greetings-header h1{font-size:clamp(1.6rem,5vw,2.4rem);background:linear-gradient(135deg,var(--gold),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.greetings-header p{color:rgba(255,255,255,.6);font-size:.95rem}
.greeting-card{background:rgba(255,255,255,.08);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:36px 30px;max-width:520px;width:100%;text-align:center;position:relative;overflow:hidden;animation:greetIn .8s cubic-bezier(.22,1,.36,1) both;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.greeting-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--gold),var(--pink),var(--gold));background-size:200% 100%;animation:shine 3s linear infinite}
@keyframes shine{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.greeting-card .quote-icon{font-size:2.5rem;margin-bottom:16px;opacity:.6}
.greeting-card .text{font-size:1.15rem;line-height:2;color:rgba(255,255,255,.95);margin-bottom:20px}
.greeting-card .from{font-size:.9rem;color:rgba(255,255,255,.5)}
.greeting-card.switching{animation:greetOut .4s ease both}
@keyframes greetIn{from{opacity:0;transform:translateY(30px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes greetOut{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-20px) scale(.95)}}
.greeting-actions{display:flex;gap:12px;margin-top:24px;flex-shrink:0}
.switch-btn{padding:10px 24px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:50px;color:rgba(255,255,255,.8);font-size:.9rem;cursor:pointer;transition:all .2s}
.switch-btn:active{transform:scale(.95);background:rgba(255,255,255,.2)}
.close-btn{padding:14px 48px;background:linear-gradient(135deg,var(--gold),var(--orange));border:none;border-radius:50px;color:#1a1a2e;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 8px 30px rgba(245,200,66,.4);transition:transform .2s,box-shadow .2s;letter-spacing:2px;margin-top:20px;flex-shrink:0}
.close-btn:active{transform:scale(.95)}
#name-page{background:linear-gradient(180deg,#16213e 0%,#0f3460 100%)}
.name-header{text-align:center;margin-bottom:30px;flex-shrink:0}
.name-header h1{font-size:clamp(1.4rem,4.5vw,1.9rem);color:var(--gold);margin-bottom:14px;text-shadow:0 0 20px rgba(245,200,66,.3)}
.name-reason{color:rgba(255,255,255,.6);font-size:.9rem;line-height:1.8}
.name-input-wrap{width:min(85vw,360px);display:flex;flex-direction:column;gap:16px;flex-shrink:0}
.name-input{width:100%;padding:16px 20px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);border-radius:14px;color:#fff;font-size:1.1rem;text-align:center;outline:none;transition:border-color .3s,box-shadow .3s;font-family:inherit}
.name-input::placeholder{color:rgba(255,255,255,.35)}
.name-input:focus{border-color:var(--gold);box-shadow:0 0 20px rgba(245,200,66,.2)}
.name-continue-btn{padding:16px 40px;background:linear-gradient(135deg,var(--gold),var(--orange));border:none;border-radius:50px;color:#1a1a2e;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 8px 30px rgba(245,200,66,.4);transition:transform .2s;letter-spacing:2px}
.name-continue-btn:active{transform:scale(.95)}
.name-continue-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
#lottery-page{background:linear-gradient(180deg,#0f3460 0%,#16213e 50%,#1a1a2e 100%)}
.lottery-header{text-align:center;margin-bottom:20px;flex-shrink:0}
.lottery-header h1{font-size:clamp(1.4rem,4.5vw,2rem);color:var(--gold);margin-bottom:6px;text-shadow:0 0 20px rgba(245,200,66,.3)}
.lottery-header p{color:rgba(255,255,255,.55);font-size:.85rem}
.lottery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(90vw,420px);flex-shrink:0}
.box{aspect-ratio:1;border-radius:16px;position:relative;cursor:pointer;background:linear-gradient(145deg,#2a2a4a,#1e1e3a);border:2px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:2.2rem;transition:all .3s ease;overflow:hidden}
.box::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.08),transparent 50%);pointer-events:none}
.box:hover:not(.opened):not(.disabled){transform:translateY(-4px) scale(1.03);border-color:var(--gold);box-shadow:0 8px 25px rgba(245,200,66,.2)}
.box.disabled{cursor:not-allowed;opacity:.5}
.box.opened{cursor:default;border-color:transparent;background:transparent;box-shadow:none}
.box.opened .box-inner{display:none}
.box.opened .prize-reveal{display:flex}
.box.shaking{animation:shake .5s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px) rotate(-2deg)}40%{transform:translateX(6px) rotate(2deg)}60%{transform:translateX(-4px) rotate(-1deg)}80%{transform:translateX(4px) rotate(1deg)}}
.box.opening{animation:boxOpen .6s ease forwards}
@keyframes boxOpen{0%{transform:scale(1)}30%{transform:scale(1.15)}60%{transform:scale(.9)}100%{transform:scale(1);background:transparent;border-color:transparent}}
.box .glow{position:absolute;inset:-50%;background:radial-gradient(circle,rgba(245,200,66,.6),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}
.box.opening .glow{opacity:1;animation:glowBurst .6s ease forwards}
@keyframes glowBurst{0%{opacity:0;transform:scale(.5)}50%{opacity:1}100%{opacity:0;transform:scale(2)}}
.prize-reveal{display:none;flex-direction:column;align-items:center;justify-content:center;gap:4px;animation:revealIn .4s ease .3s both}
@keyframes revealIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
.prize-reveal .icon{font-size:2rem}
.prize-reveal .label{font-size:.65rem;color:rgba(255,255,255,.7);text-align:center;line-height:1.3}
.prize-reveal.winner{animation:winnerPulse 1s ease infinite}
@keyframes winnerPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.lottery-footer{margin-top:20px;text-align:center;flex-shrink:0;min-height:60px}
.draw-result{font-size:1.1rem;color:var(--gold);margin-bottom:12px;animation:fadeInUp .5s ease both}
@keyframes fadeInUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.view-result-btn{padding:14px 40px;background:linear-gradient(135deg,var(--pink),var(--red));border:none;border-radius:50px;color:#fff;font-size:1rem;font-weight:700;cursor:pointer;box-shadow:0 8px 30px rgba(231,76,60,.4);animation:fadeInUp .5s ease .2s both,btnGlow 2s ease infinite;letter-spacing:2px}
@keyframes btnGlow{0%,100%{box-shadow:0 8px 30px rgba(231,76,60,.4)}50%{box-shadow:0 8px 40px rgba(231,76,60,.7)}}
.view-result-btn:active{transform:scale(.95)}
.already-drawn{color:rgba(255,255,255,.4);font-size:.9rem}
.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .4s ease}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal-card{background:linear-gradient(160deg,#1e1e3a,#2a2a4a);border-radius:24px;padding:24px 20px;max-width:480px;width:100%;max-height:92vh;overflow-y:auto;border:1px solid rgba(255,255,255,.1);box-shadow:0 30px 80px rgba(0,0,0,.5);transform:scale(.8) translateY(30px);transition:transform .4s cubic-bezier(.22,1,.36,1);position:relative}
.modal-overlay.active .modal-card{transform:scale(1) translateY(0)}
.modal-close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10;transition:background .2s}
.modal-close:active{background:rgba(255,255,255,.3)}
.video-wrap{width:100%;border-radius:16px;overflow:hidden;margin-bottom:16px;background:#000;position:relative}
.video-wrap video{width:100%;display:block;max-height:50vh;object-fit:contain;background:#000}
.video-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.6);font-size:.9rem;flex-direction:column;gap:10px}
.spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.2);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.prize-result{text-align:center;margin-top:8px}
.prize-badge{display:inline-block;padding:8px 28px;border-radius:50px;font-size:1.3rem;font-weight:800;margin-bottom:12px;letter-spacing:3px}
.prize-badge.first{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#5a3000;box-shadow:0 0 30px rgba(255,215,0,.5)}
.prize-badge.second{background:linear-gradient(135deg,#c0c0c0,#e8e8e8);color:#333;box-shadow:0 0 20px rgba(192,192,192,.4)}
.prize-badge.third{background:linear-gradient(135deg,#cd7f32,#daa06d);color:#3a1f00;box-shadow:0 0 20px rgba(205,127,50,.4)}
.prize-badge.fourth{background:linear-gradient(135deg,#3498db,#2ecc71);color:#fff;box-shadow:0 0 20px rgba(52,152,219,.4)}
.prize-badge.happy{background:linear-gradient(135deg,#ff6b9d,#9b59b6);color:#fff;box-shadow:0 0 20px rgba(255,107,157,.4)}
.prize-desc{font-size:.95rem;color:rgba(255,255,255,.7);line-height:1.8;margin-bottom:8px}
.prize-tip{font-size:.8rem;color:rgba(255,255,255,.4);margin-top:10px}
.confetti{position:fixed;top:-10px;width:10px;height:10px;z-index:200;pointer-events:none;animation:confettiFall linear forwards}
@keyframes confettiFall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
@media(max-height:600px){.greetings-header{margin-bottom:16px}.greeting-card{padding:24px 20px;min-height:160px}.greeting-card .text{font-size:1rem}.lottery-header{margin-bottom:12px}.lottery-grid{gap:8px}.box{font-size:1.6rem;border-radius:12px}.close-btn{padding:12px 36px;margin-top:14px}.name-header{margin-bottom:16px}.name-input{padding:12px 16px}}
</style>
</head>
<body>
<div id="stars"></div>

<div id="paper-stage">
  <div class="paper" id="paper">
    <div class="paper-content">
      <div class="emoji">💌</div>
      <h2>致最敬爱的老师</h2>
      <p>有一份来自学生的<br>教师节惊喜<br>请轻轻点击开启</p>
      <div class="tap-hint">👆 点击任意处打开</div>
    </div>
  </div>
</div>

<div class="page" id="greetings-page">
  <div class="greetings-header">
    <h1>🌸 教师节快乐 🌸</h1>
    <p>来自学生的一份祝福</p>
  </div>
  <div class="greeting-card" id="greeting-card">
    <div class="quote-icon">💬</div>
    <div class="text" id="greeting-text"></div>
    <div class="from" id="greeting-from"></div>
  </div>
  <button class="close-btn" id="close-greetings">开启惊喜盲盒 🎁</button>
</div>

<div class="page" id="name-page">
  <div class="name-header">
    <h1>✏️ 请留下您的姓名</h1>
    <p class="name-reason">为方便中奖后核对领奖信息，请输入您的姓名<br>信息仅用于本次活动领奖，不会对外公开</p>
  </div>
  <div class="name-input-wrap">
    <input type="text" id="teacher-name" class="name-input" placeholder="请输入您的姓名" maxlength="20" autocomplete="off">
    <button class="name-continue-btn" id="name-continue">进入抽奖 🎁</button>
  </div>
</div>

<div class="page" id="lottery-page">
  <div class="lottery-header">
    <h1>🎁 惊喜盲盒</h1>
    <p>九个盒子，一个属于你的惊喜 · 点击选择</p>
  </div>
  <div class="lottery-grid" id="lottery-grid"></div>
  <div class="lottery-footer" id="lottery-footer"></div>
</div>

<div class="modal-overlay" id="result-modal">
  <div class="modal-card">
    <button class="modal-close" id="modal-close">✕</button>
    <div class="prize-result" id="prize-result"></div>
    <div class="video-wrap" id="video-wrap">
      <div class="video-loading" id="video-loading">
        <div class="spinner"></div>
        <span>祝福视频加载中...</span>
      </div>
      <video id="blessing-video" playsinline webkit-playsinline x5-playsinline controls preload="metadata" style="display:none;width:100%"></video>
    </div>
  </div>
</div>

<script>
const GREETINGS = [
  {text:"老师，您是火种，点燃了学生的心灵之火；您是石阶，承受着我一步步踏实的向上攀登。教师节快乐！",from:"—— 您的学生"},
  {text:"粉笔灰染白了您的双鬓，却染不老您对教育的热忱。老师，辛苦了，节日快乐！",from:"—— 全体同学"},
  {text:"您用智慧的光芒照亮我们前行的路，用温暖的话语滋润我们的心田。教师节快乐！",from:"—— 爱您的学生"},
  {text:"三尺讲台，三寸舌，三寸笔，三千桃李；十年树木，十载风，十载雨，十万栋梁。老师节日快乐！",from:"—— 您的学生"},
  {text:"您讲的课，是那样丰富多彩，每一个章节都仿佛在我面前打开了一扇窗户，让我看到了一个斑斓的新世界。",from:"—— 学生敬上"},
  {text:"亲爱的老师，您的教诲如春风，似瑞雨，永铭我心。愿您岁岁平安，年年如意！",from:"—— 您的学生"},
  {text:"因为有您，我们的世界才如此美丽；因为有您，我们的人生才如此精彩。教师节快乐！",from:"—— 全体学生"},
  {text:"您是大桥，为我们连接被割断的山峦；您是青藤，坚韧而修长，指引我们采撷到崖顶的灵芝。",from:"—— 学生敬上"},
  {text:"老师，您用心中全部的爱，染成了我们青春的色彩；您用执著的信念，铸成了我们性格的不屈。",from:"—— 爱您的学生"},
  {text:"在这个特别的日子里，我想对您说：老师，您辛苦了！愿您今后更加健康快乐！",from:"—— 您的学生"},
  {text:"您的爱，太阳一般温暖，春风一般和煦，清泉一般甘甜。您的爱，比父爱更严峻，比母爱更细腻。",from:"—— 学生敬上"},
  {text:"老师，您是美的耕耘者，美的播种者。是您用美的阳光普照，用美的雨露滋润，我们的心田才绿草如茵！",from:"—— 全体同学"},
  {text:"您像一支蜡烛，虽然细弱，但有一分热，发一分光，照亮了别人，耗尽了自己。这无私的奉献，令人永志不忘。",from:"—— 您的学生"},
  {text:"海水退潮的时候，把五彩的贝壳留在沙滩上。我们毕业的时候，把诚挚的祝愿献给老师。",from:"—— 学生敬上"},
  {text:"您的岗位永不调换，您的足迹却遍布四方；您的两鬓会有一天斑白，您的青春却百年不衰。",from:"—— 爱您的学生"},
  {text:"老师，在今天我们身上散发的智慧光芒里，依然闪烁着您当年点燃的火花！教师节快乐！",from:"—— 您的学生"},
  {text:"献给敬爱的老师：我们搜寻那些美丽耐人的回忆，也默默遥远地祝福您永远健康快乐！",from:"—— 全体学生"},
  {text:"老师，您的每句话每个字，都像春天的种子，在我们心中发芽。感谢您，节日快乐！",from:"—— 您的学生"},
  {text:"人生旅程上，您丰富我的心灵，开发我的智力，为我点燃了希望的光芒。谢谢您，老师！",from:"—— 学生敬上"},
  {text:"一支粉笔两袖清风，三尺讲台四季晴雨。您用平凡的人生，书写了不平凡的篇章。教师节快乐！",from:"—— 您的学生"}
];

const VIDEO_URLS = [
  "v1.mp4",
  "v2.mp4",
  "v3.mp4",
  "v4.mp4",
  "v5.mp4"
];

const PRIZES = {
  happy:{label:"教师节快乐",desc:"感谢您的辛勤付出！这是学生们最真挚的祝福。",weight:65,limit:Infinity,emoji:"🌷"},
  first:{label:"一等奖",desc:"恭喜获得一等奖！神秘大奖一份，请联系学生代表领取 🎉",weight:1,limit:1,emoji:"🏆"},
  second:{label:"二等奖",desc:"恭喜获得二等奖！精美礼品一份，请联系学生代表领取 🎊",weight:2,limit:2,emoji:"🥈"},
  third:{label:"三等奖",desc:"恭喜获得三等奖！贴心小礼物一份，请联系学生代表领取 🎁",weight:3,limit:5,emoji:"🥉"},
  fourth:{label:"四等奖",desc:"恭喜获得四等奖！惊喜小礼品一份，请联系学生代表领取 🌟",weight:12,limit:20,emoji:"🎀"}
};

const BOX_ICONS = ["🎁","🎀","🎊","🎉","💝","🎈","🌟","💫","🎁"];
const STORAGE_KEY = "teachers_day_2026_draw";
const NOTIFY_EMAIL = "2190659818@qq.com";
let teacherName = "";

// 生成/读取访客唯一ID，方便区分不同老师
function getVisitorId(){
  let id=localStorage.getItem("td_visitor_id");
  if(!id){id="V"+Math.random().toString(36).substr(2,8).toUpperCase();localStorage.setItem("td_visitor_id",id)}
  return id;
}

// 抽奖结果邮件通知（fire and forget，不阻塞页面）
function sendDrawNotification(prize){
  try{
    const now=new Date();
    const timeStr=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0")+" "+String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0")+":"+String(now.getSeconds()).padStart(2,"0");
    fetch("https://formsubmit.co/ajax/"+NOTIFY_EMAIL,{
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify({
        _subject:"【教师节抽奖】"+(teacherName||"某老师")+"抽中了"+PRIZES[prize].label,
        name:"教师节盲盒抽奖",
        email:"no-reply@xiaobi123.github.io",
        message:"中奖奖项："+PRIZES[prize].emoji+" "+PRIZES[prize].label+"\n老师姓名："+(teacherName||"未填写")+"\n访客ID："+getVisitorId()+"\n抽奖时间："+timeStr+"\n\n—— 来自教师节祝福网站自动通知",
        _template:"table",
        _captcha:"false"
      })
    }).catch(()=>{});
  }catch(e){}
}

// ===== 视频预加载：页面打开立即全部下载为blob，确保秒开 =====
const VIDEO_BLOBS = [];
let blobLoadCount = 0;
VIDEO_URLS.forEach((u,i)=>{
  fetch(u).then(r=>r.blob()).then(blob=>{
    VIDEO_BLOBS[i]=URL.createObjectURL(blob);
    blobLoadCount++;
  }).catch(()=>{blobLoadCount++});
});

(function(){const c=document.getElementById("stars");for(let i=0;i<60;i++){const s=document.createElement("div");s.className="star";s.style.left=Math.random()*100+"%";s.style.top=Math.random()*100+"%";s.style.width=s.style.height=(Math.random()*3+1)+"px";s.style.setProperty("--d",(Math.random()*3+2)+"s");s.style.animationDelay=Math.random()*3+"s";c.appendChild(s)}})();

function getInventory(){try{const raw=localStorage.getItem(STORAGE_KEY+"_inv");if(raw)return JSON.parse(raw)}catch(e){}return{first:0,second:0,third:0,fourth:0}}
function saveInventory(inv){try{localStorage.setItem(STORAGE_KEY+"_inv",JSON.stringify(inv))}catch(e){}}
function getDrawResult(){try{const raw=localStorage.getItem(STORAGE_KEY);return raw?JSON.parse(raw):null}catch(e){return null}}
function saveDrawResult(result){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(result))}catch(e){}}

function drawPrize(){
  const inv=getInventory();
  const available=[];let totalWeight=0;
  for(const[key,p]of Object.entries(PRIZES)){
    const claimed=inv[key]||0;
    if(claimed<p.limit){available.push({key,weight:p.weight});totalWeight+=p.weight}
  }
  if(available.length===0)return"happy";
  let r=Math.random()*totalWeight;
  for(const item of available){r-=item.weight;if(r<=0)return item.key}
  return available[0].key;
}

// ===== 随机祝福 =====
let currentGreetingIdx = -1;
function showRandomGreeting(){
  let idx;
  do{idx=Math.floor(Math.random()*GREETINGS.length)}while(idx===currentGreetingIdx&&GREETINGS.length>1);
  currentGreetingIdx=idx;
  const g=GREETINGS[idx];
  const card=document.getElementById("greeting-card");
  card.classList.add("switching");
  setTimeout(()=>{
    document.getElementById("greeting-text").textContent=g.text;
    document.getElementById("greeting-from").textContent=g.from;
    card.classList.remove("switching");
    card.style.animation="none";
    void card.offsetWidth;
    card.style.animation="greetIn .8s cubic-bezier(.22,1,.36,1) both";
  },350);
}

// ===== 入场 =====
const paperStage=document.getElementById("paper-stage");
paperStage.addEventListener("click",function(){
  paperStage.style.transition="opacity .6s,transform .6s";
  paperStage.style.opacity="0";
  paperStage.style.transform="scale(1.1)";
  setTimeout(()=>{paperStage.style.display="none";showGreetings()},600);
});

function showGreetings(){
  showRandomGreeting();
  document.getElementById("greetings-page").classList.add("active");
}

document.getElementById("close-greetings").addEventListener("click",function(){
  document.getElementById("greetings-page").classList.remove("active");
  setTimeout(showNamePage,400);
});

// ===== 姓名输入页 =====
function showNamePage(){
  document.getElementById("name-page").classList.add("active");
  const input=document.getElementById("teacher-name");
  input.value="";
  setTimeout(()=>input.focus(),500);
}

document.getElementById("name-continue").addEventListener("click",function(){
  const input=document.getElementById("teacher-name");
  const name=input.value.trim();
  if(!name){
    input.style.borderColor="#e74c3c";
    input.placeholder="请先输入您的姓名";
    input.focus();
    return;
  }
  teacherName=name;
  try{localStorage.setItem("td_teacher_name",name)}catch(e){}
  document.getElementById("name-page").classList.remove("active");
  setTimeout(showLottery,400);
});

document.getElementById("teacher-name").addEventListener("keydown",function(e){
  if(e.key==="Enter"){document.getElementById("name-continue").click()}
});

// ===== 抽奖 =====
let drawn=false;
function showLottery(){
  document.getElementById("lottery-page").classList.add("active");
  // 恢复已保存的姓名
  try{const saved=localStorage.getItem("td_teacher_name");if(saved)teacherName=saved}catch(e){}
  const grid=document.getElementById("lottery-grid");
  const footer=document.getElementById("lottery-footer");
  grid.innerHTML="";footer.innerHTML="";
  // 检查是否已抽过奖（同一设备不能重复抽）
  const existing=getDrawResult();
  if(existing){
    drawn=true;
    renderBoxes(grid,existing.prize,existing.winningIndex);
    const displayName=existing.name||teacherName||"";
    footer.innerHTML=`<div class="draw-result">${displayName?displayName+"，":""}您已参与过抽奖，获得：${PRIZES[existing.prize].emoji} ${PRIZES[existing.prize].label}</div><button class="view-result-btn" id="view-result" style="padding:12px 28px;font-size:.95rem">查看祝福视频 📹</button>`;
    document.getElementById("view-result").addEventListener("click",()=>showResultModal(existing.prize));
    return;
  }
  drawn=false;
  renderBoxes(grid,null,-1);
}

function renderBoxes(grid,wonPrize,winningIndex){
  for(let i=0;i<9;i++){
    const box=document.createElement("div");
    box.className="box";box.dataset.index=i;
    if(wonPrize!==null){
      box.classList.add("opened","disabled");
      if(i===winningIndex){
        box.innerHTML=`<div class="glow"></div><div class="box-inner">${BOX_ICONS[i]}</div><div class="prize-reveal winner"><span class="icon">${PRIZES[wonPrize].emoji}</span><span class="label">${PRIZES[wonPrize].label}</span></div>`;
      }else{
        const ei=["💨","❌","🕳️","💭","🌬️"];
        box.innerHTML=`<div class="prize-reveal"><span class="icon">${ei[i%ei.length]}</span><span class="label">空空如也</span></div>`;
      }
    }else{
      box.innerHTML=`<div class="glow"></div><div class="box-inner">${BOX_ICONS[i]}</div><div class="prize-reveal"></div>`;
      box.addEventListener("click",()=>handleBoxClick(i,box,grid));
    }
    grid.appendChild(box);
  }
}

function handleBoxClick(index,clickedBox,grid){
  if(drawn)return;drawn=true;
  const allBoxes=grid.querySelectorAll(".box");
  allBoxes.forEach(b=>b.classList.add("disabled"));
  clickedBox.classList.add("shaking");
  setTimeout(()=>{
    clickedBox.classList.remove("shaking");
    clickedBox.classList.add("opening");
    const prize=drawPrize();
    const result={prize,winningIndex:index,time:Date.now(),name:teacherName};
    saveDrawResult(result);
    sendDrawNotification(prize);
    setTimeout(()=>{
      const ei=["💨","❌","🕳️","💭","🌬️"];
      allBoxes.forEach((b,i)=>{
        b.classList.add("opened");
        const reveal=b.querySelector(".prize-reveal");
        if(i===index){
          reveal.classList.add("winner");
          reveal.innerHTML=`<span class="icon">${PRIZES[prize].emoji}</span><span class="label">${PRIZES[prize].label}</span>`;
        }else{
          reveal.innerHTML=`<span class="icon">${ei[i%ei.length]}</span><span class="label">空空如也</span>`;
        }
      });
      const footer=document.getElementById("lottery-footer");
      footer.innerHTML=`<div class="draw-result">🎉 恭喜获得：${PRIZES[prize].emoji} ${PRIZES[prize].label}！</div><button class="view-result-btn" id="view-result" style="padding:12px 28px;font-size:.95rem">查看祝福视频 📹</button>`;
      document.getElementById("view-result").addEventListener("click",()=>showResultModal(prize));
      if(prize!=="happy"){launchConfetti()}
    },600);
  },500);
}

// ===== 结果弹窗 + 真实视频 =====
function showResultModal(prize){
  const modal=document.getElementById("result-modal");
  const resultDiv=document.getElementById("prize-result");
  const p=PRIZES[prize];
  resultDiv.innerHTML=`<div class="prize-badge ${prize}">${p.emoji} ${p.label}</div><div class="prize-desc">${p.desc}</div><div class="prize-tip">📱 下方是同学们录制的祝福视频</div>`;
  modal.classList.add("active");
  const video=document.getElementById("blessing-video");
  const loading=document.getElementById("video-loading");
  // 优先用已预加载完成的blob视频（秒开），没有就用原URL随机选
  const readyBlobs = VIDEO_BLOBS.filter(x=>x);
  let videoSrc;
  if(readyBlobs.length>0){
    videoSrc = readyBlobs[Math.floor(Math.random()*readyBlobs.length)];
  } else {
    videoSrc = VIDEO_URLS[Math.floor(Math.random()*VIDEO_URLS.length)];
  }
  video.style.display="none";
  loading.style.display="flex";
  loading.innerHTML='<div class="spinner"></div><span>祝福视频加载中...</span>';
  video.innerHTML=`<source src="${videoSrc}" type="video/mp4">`;
  video.load();
  let loaded=false;
  video.oncanplay=function(){loaded=true;loading.style.display="none";video.style.display="block";video.play().catch(()=>{})};
  video.onerror=function(){
    if(!loaded){
      loading.innerHTML='<div class="spinner"></div><span>视频加载中，请稍候...</span>';
      setTimeout(()=>{video.load()},1500);
      setTimeout(()=>{if(!loaded){loading.innerHTML='<span style="font-size:2rem">🎬</span><span>视频加载失败</span><button onclick="document.getElementById(\'blessing-video\').load()" style="margin-top:10px;padding:8px 20px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:20px;color:#fff;cursor:pointer">重新加载</button>'}},8000);
    }
  };
  if(prize!=="happy"){setTimeout(launchConfetti,300)}
}

document.getElementById("modal-close").addEventListener("click",()=>{
  document.getElementById("result-modal").classList.remove("active");
  const video=document.getElementById("blessing-video");
  video.pause();
  video.src="";
});

// ===== 彩带 =====
function launchConfetti(){
  const colors=["#f5c842","#e74c3c","#ff6b9d","#9b59b6","#3498db","#2ecc71","#f39c12","#fff"];
  for(let i=0;i<80;i++){
    setTimeout(()=>{
      const c=document.createElement("div");
      c.className="confetti";
      c.style.left=Math.random()*100+"vw";
      c.style.background=colors[Math.floor(Math.random()*colors.length)];
      c.style.width=(Math.random()*8+6)+"px";
      c.style.height=(Math.random()*12+8)+"px";
      c.style.borderRadius=Math.random()>0.5?"50%":"2px";
      c.style.animationDuration=(Math.random()*2+2)+"s";
      c.style.animationDelay=Math.random()*0.5+"s";
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),4500);
    },i*20);
  }
}
</script>
