<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xiaobi123</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    overflow: hidden;
    position: relative;
  }
  body::before {
    content: '';
    position: absolute;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(99,102,241,0.3) 0%, transparent 70%);
    top: -200px; right: -200px;
    border-radius: 50%;
    animation: float 8s ease-in-out infinite;
  }
  body::after {
    content: '';
    position: absolute;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(236,72,153,0.2) 0%, transparent 70%);
    bottom: -150px; left: -150px;
    border-radius: 50%;
    animation: float 10s ease-in-out infinite reverse;
  }
  @keyframes float {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(30px, -30px); }
  }
  .container {
    text-align: center;
    z-index: 1;
    padding: 40px;
  }
  .logo {
    font-size: clamp(4rem, 15vw, 8rem);
    font-weight: 900;
    letter-spacing: -2px;
    background: linear-gradient(135deg, #6366f1, #ec4899, #f59e0b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradient 5s ease infinite;
    background-size: 200% 200%;
  }
  @keyframes gradient {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .tagline {
    font-size: clamp(1rem, 3vw, 1.4rem);
    color: rgba(255,255,255,0.7);
    margin-top: 16px;
    font-weight: 300;
    letter-spacing: 4px;
  }
  .divider {
    width: 60px;
    height: 3px;
    background: linear-gradient(90deg, #6366f1, #ec4899);
    margin: 32px auto;
    border-radius: 2px;
  }
  .links {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 24px;
  }
  .link-btn {
    padding: 12px 28px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 50px;
    color: #fff;
    text-decoration: none;
    font-size: 0.95rem;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
    background: rgba(255,255,255,0.05);
  }
  .link-btn:hover {
    background: rgba(255,255,255,0.15);
    border-color: rgba(255,255,255,0.4);
    transform: translateY(-2px);
  }
  .footer {
    position: fixed;
    bottom: 24px;
    left: 0; right: 0;
    text-align: center;
    font-size: 0.8rem;
    color: rgba(255,255,255,0.3);
  }
</style>
</head>
<body>
  <div class="container">
    <div class="logo">xiaobi123</div>
    <div class="tagline">WELCOME</div>
    <div class="divider"></div>
    <div class="links">
      <a href="mailto:xiaobi123@example.com" class="link-btn">联系我</a>
      <a href="https://github.com/ChinaXiaoBi" class="link-btn" target="_blank">GitHub</a>
    </div>
  </div>
  <div class="footer">xiaobi123 &copy; 2026</div>
</body>
</html>
