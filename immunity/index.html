<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>体液免疫交互模型</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#fff;color:#333}
body{display:flex;flex-direction:column;touch-action:manipulation}
.header{background:linear-gradient(135deg,#2c5f2d,#4a8c4a);color:#fff;padding:5px 10px;text-align:center;flex-shrink:0}
.header h1{font-size:0.95rem;font-weight:700}
.header p{font-size:0.65rem;opacity:0.85;margin-top:1px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.palette{background:#f7f9f4;padding:5px;overflow-x:auto;overflow-y:hidden;flex-shrink:0;display:flex;flex-direction:row;gap:5px;align-items:flex-start;border-bottom:2px solid #d8e0d0;-webkit-overflow-scrolling:touch}
.pal-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 7px;background:#fff;border:2px solid #d0d8c8;border-radius:8px;cursor:pointer;user-select:none;-webkit-user-select:none;font-size:0.6rem;min-width:56px;flex-shrink:0;text-align:center;position:relative}
.pal-item:active{background:#e8f5e9}
.pal-item .pic{width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.pal-item.arrow-tool{border-color:#2980b9;background:#eaf2f8}
.pal-item.arrow-tool.active{outline:3px solid #2980b9;background:#d4e6f1}
.pal-item.pen-tool{border-color:#e74c3c;background:#fdf0ef}
.pal-item.pen-tool.active{outline:3px solid #e74c3c;background:#fadbd8}
.pal-item.eraser-tool{border-color:#7f8c8d;background:#f4f6f6}
.pal-item.eraser-tool.active{outline:3px solid #7f8c8d;background:#e5e8e8}
.pal-item.select-tool{border-color:#2c5f2d;background:#eef5ee}
.pal-item.select-tool.active{outline:3px solid #2c5f2d;background:#d5e8d5}
.canvas{flex:1;position:relative;overflow:hidden;background:#fff;background-image:radial-gradient(circle,#dde5d5 1px,transparent 1px);background-size:18px 18px;touch-action:none}
.placed{position:absolute;cursor:grab;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;align-items:center;z-index:20;transform:translateX(-50%);will-change:left,top;touch-action:none}
.placed.arrow-source{outline:3px solid #2980b9;outline-offset:2px;border-radius:10px;z-index:50}
.placed .cell{width:46px;height:46px;display:flex;align-items:center;justify-content:center}
.placed .name{font-size:0.62rem;background:rgba(255,255,255,0.95);padding:1px 5px;border-radius:4px;white-space:nowrap;margin-top:2px;border:1px solid #e0e0e0;font-weight:600;color:#444}
.virus-body{width:34px;height:34px;background:#e74c3c;border-radius:50%;position:relative;border:2px solid #c0392b}
.virus-body::before{content:'';position:absolute;inset:-5px;background:repeating-conic-gradient(from 0deg,#e74c3c 0deg 12deg,transparent 12deg 30deg);border-radius:50%;z-index:-1}
.virus-body::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:13px;height:13px;background:#c0392b;border-radius:50%}
.apc-body{width:42px;height:36px;background:#27ae60;border-radius:45% 55% 50% 50%/55% 45% 55% 45%;position:relative;border:2px solid #1e8449}
.apc-body::after{content:'';position:absolute;top:30%;left:30%;width:13px;height:10px;background:#1e8449;border-radius:50%}
.helper-body{width:38px;height:38px;background:#3498db;border-radius:50%;border:2px solid #2980b9;position:relative}
.helper-body::after{content:'';position:absolute;top:30%;left:30%;width:13px;height:13px;background:#2980b9;border-radius:50%}
.bcell-body{width:38px;height:38px;background:#f1c40f;border-radius:50%;border:2px solid #d4ac0d;position:relative}
.bcell-body::after{content:'';position:absolute;top:30%;left:30%;width:13px;height:13px;background:#d4ac0d;border-radius:50%}
.plasma-body{width:46px;height:32px;background:#9b59b6;border-radius:40% 60% 55% 45%/50% 45% 55% 50%;border:2px solid #7d3c98;position:relative}
.plasma-body::after{content:'';position:absolute;top:25%;left:20%;width:16px;height:11px;background:#7d3c98;border-radius:40%}
.memory-body{width:36px;height:36px;background:#e67e22;border-radius:50%;border:3px dashed #fff;outline:2px solid #d35400;position:relative}
.memory-body::after{content:'';position:absolute;top:30%;left:30%;width:12px;height:12px;background:#d35400;border-radius:50%}
.antibody-body{display:flex;align-items:center;justify-content:center}
.arrow-tool-body{font-size:22px;line-height:1;color:#2980b9}
.arrow-svg{position:absolute;top:0;left:0;pointer-events:none;z-index:10;overflow:visible}
.draw-svg{position:absolute;top:0;left:0;z-index:15;overflow:visible;touch-action:none}
.draw-svg path{pointer-events:none}
.controls{padding:5px 8px;background:#f7f9f4;border-top:2px solid #d8e0d0;display:flex;gap:5px;justify-content:center;flex-shrink:0;flex-wrap:wrap}
.controls button{padding:7px 13px;border:none;border-radius:16px;font-size:0.78rem;cursor:pointer;font-weight:600}
.controls button:active{transform:scale(0.95)}
.btn-submit{background:#e67e22;color:#fff}
.btn-reset{background:#95a5a6;color:#fff}
.btn-del{background:#e74c3c;color:#fff}
.btn-del.active{background:#c0392b;box-shadow:0 0 0 2px rgba(231,76,60,0.3)}
.btn-undo{background:#3498db;color:#fff}
.btn-undo:disabled{background:#bdc3c7}
.feedback{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#fff8e1;border:2px solid #ffc107;border-radius:10px;padding:10px 14px;max-width:94%;width:340px;z-index:100;display:none;box-shadow:0 4px 20px rgba(0,0,0,0.15)}
.feedback.show{display:block}
.feedback.ok{background:#e8f5e9;border-color:#4caf50}
.feedback h4{font-size:0.9rem;margin-bottom:5px}
.feedback ul{padding-left:16px;font-size:0.78rem;line-height:1.6;color:#555}
.feedback .close-fb{float:right;cursor:pointer;font-size:1.1rem;color:#999;padding:0 4px;line-height:1}
.rotate-tip{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:rgba(44,95,45,0.9);color:#fff;padding:6px 14px;border-radius:16px;font-size:0.72rem;z-index:99;display:none}
.rotate-tip.show{display:block;animation:fadeIn 0.5s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.submit-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;align-items:center;justify-content:center}
.submit-modal.show{display:flex}
.submit-box{background:#fff;border-radius:14px;padding:20px;width:90%;max-width:340px;text-align:center}
.submit-box h3{font-size:1.1rem;margin-bottom:12px;color:#2c5f2d}
.submit-box input{width:100%;padding:10px 12px;border:2px solid #d0d8c8;border-radius:8px;font-size:1rem;margin-bottom:12px;outline:none}
.submit-box input:focus{border-color:#4a8c4a}
.submit-box .btn-row{display:flex;gap:8px;justify-content:center}
.submit-box .btn-row button{padding:8px 20px;border:none;border-radius:18px;font-size:0.9rem;font-weight:600;cursor:pointer}
.submit-box .btn-cancel{background:#eee;color:#666}
.submit-box .btn-send{background:#e67e22;color:#fff}
.submit-box .btn-send:disabled{background:#ccc}
.submit-ok{text-align:center;padding:20px}
.submit-ok .big{font-size:48px;margin-bottom:10px}
.color-pop{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.2);padding:8px;display:none;z-index:200;white-space:nowrap}
.color-pop.show{display:flex;gap:6px}
.color-dot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.3);flex-shrink:0}
.color-dot:active{transform:scale(1.2)}
.color-dot.selected{outline:3px solid #333;outline-offset:1px}
@media(min-width:500px) and (orientation:landscape){
  .main{flex-direction:row}
  .palette{flex-direction:column;width:120px;overflow-y:auto;overflow-x:hidden;border-right:2px solid #d8e0d0;border-bottom:none;padding:8px;align-items:stretch}
  .pal-item{flex-direction:row;font-size:0.7rem;min-width:0;width:100%;padding:6px 8px;justify-content:flex-start;gap:8px}
  .pal-item .pic{width:26px;height:26px}
  .placed .cell{width:52px;height:52px}
  .virus-body{width:38px;height:38px}
  .apc-body{width:48px;height:42px}
  .helper-body,.bcell-body,.memory-body{width:42px;height:42px}
  .plasma-body{width:54px;height:38px}
  .antibody-body{font-size:28px}
}
</style>
</head>
<body>
<div class="header">
  <h1>🧬 体液免疫交互模型</h1>
  <p>高中生物选必1 · 点素材添加 → 拖动摆放 → 点箭头连线 → 提交</p>
</div>
<div class="main">
  <div class="palette" id="palette">
    <div class="pal-item select-tool active" id="selectTool" onclick="toggleSelectTool()"><span class="pic" style="font-size:20px">🖱️</span>选择</div>
    <div class="pal-item" data-type="virus" onclick="onPalClick(this)"><span class="pic"><div class="virus-body"></div></span>诺如病毒</div>
    <div class="pal-item" data-type="apc" onclick="onPalClick(this)"><span class="pic"><div class="apc-body"></div></span>抗原呈递细胞</div>
    <div class="pal-item" data-type="helperT" onclick="onPalClick(this)"><span class="pic"><div class="helper-body"></div></span>辅助性T细胞</div>
    <div class="pal-item" data-type="bcell" onclick="onPalClick(this)"><span class="pic"><div class="bcell-body"></div></span>B细胞</div>
    <div class="pal-item" data-type="plasma" onclick="onPalClick(this)"><span class="pic"><div class="plasma-body"></div></span>浆细胞</div>
    <div class="pal-item" data-type="memory" onclick="onPalClick(this)"><span class="pic"><div class="memory-body"></div></span>记忆B细胞</div>
    <div class="pal-item" data-type="antibody" onclick="onPalClick(this)"><span class="pic"><div class="antibody-body"><svg viewBox="0 0 40 40" width="24" height="24"><path d="M20 35 L20 20 M20 20 L8 8 M20 20 L32 8" stroke="#c0392b" stroke-width="4" stroke-linecap="round" fill="none"/></svg></div></span>抗体</div>
    <div class="pal-item arrow-tool" id="arrowTool" onclick="toggleArrowTool()"><span class="pic"><div class="arrow-tool-body">↗</div></span>箭头</div>
    <div class="pal-item pen-tool" id="penTool" onclick="onPenClick()">
      <span class="pic" style="font-size:20px">🖊️</span><span id="penLabel">画笔</span>
      <div class="color-pop" id="colorPop"></div>
    </div>
    <div class="pal-item eraser-tool" id="eraserTool" onclick="toggleEraserTool()"><span class="pic" style="font-size:20px">🧽</span>橡皮</div>
  </div>
  <div class="canvas" id="canvas">
    <svg class="arrow-svg" id="arrowSvg"></svg>
    <svg class="draw-svg" id="drawSvg"></svg>
    <div class="feedback" id="feedback">
      <span class="close-fb" onclick="hideFb()">&times;</span>
      <h4 id="fbTitle"></h4>
      <ul id="fbList"></ul>
    </div>
  </div>
</div>
<div class="controls">
  <button class="btn-undo" id="btnUndo" onclick="undoLast()">↩️ 撤回</button>
  <button class="btn-del" id="btnDel" onclick="toggleDel()">🗑 删除</button>
  <button class="btn-reset" onclick="resetAll()">🔄 重置</button>
  <button class="btn-submit" onclick="showSubmitModal()">📤 提交答案</button>
</div>
<div class="rotate-tip" id="rotateTip">💡 横屏使用效果更佳</div>
<div class="submit-modal" id="submitModal">
  <div class="submit-box" id="submitBox">
    <h3>📤 提交你的答案</h3>
    <p style="font-size:0.8rem;color:#888;margin-bottom:12px">提交后老师会收到你的模型截图</p>
    <input type="text" id="studentName" placeholder="输入你的姓名" maxlength="20">
    <div class="btn-row">
      <button class="btn-cancel" onclick="closeSubmitModal()">取消</button>
      <button class="btn-send" id="sendBtn" onclick="doSubmit()">提交</button>
    </div>
  </div>
</div>
<script>
var CELL_INFO = {
  virus:{name:'诺如病毒',cls:'virus-body',html:''},
  apc:{name:'抗原呈递细胞',cls:'apc-body',html:''},
  helperT:{name:'辅助性T细胞',cls:'helper-body',html:''},
  bcell:{name:'B细胞',cls:'bcell-body',html:''},
  plasma:{name:'浆细胞',cls:'plasma-body',html:''},
  memory:{name:'记忆B细胞',cls:'memory-body',html:''},
  antibody:{name:'抗体',cls:'antibody-body',html:'<svg viewBox="0 0 40 40" width="32" height="32"><path d="M20 35 L20 20 M20 20 L8 8 M20 20 L32 8" stroke="#c0392b" stroke-width="4" stroke-linecap="round" fill="none"/></svg>'}
};
var TARGETS = {
  virus:{x:10,y:55}, apc:{x:27,y:55}, helperT:{x:44,y:22},
  bcell:{x:60,y:58}, memory:{x:77,y:20}, plasma:{x:77,y:82}, antibody:{x:91,y:82}
};
var REQUIRED_ARROWS = [
  {from:'virus',to:'apc'},{from:'apc',to:'helperT'},{from:'helperT',to:'bcell'},
  {from:'bcell',to:'plasma'},{from:'bcell',to:'memory'},{from:'plasma',to:'antibody'}
];
var PEN_COLORS = ['#e74c3c','#2980b9','#27ae60','#2c3e50','#e67e22','#8e44ad','#f1c40f','#ffffff'];
var PEN_COLOR_NAMES = ['红','蓝','绿','黑','橙','紫','黄','白'];
var elements = [];
var arrows = [];
var undoStack = [];
var strokes = [];
var dragEl = null, dragOffsetX = 0, dragOffsetY = 0;
var delMode = false, arrowMode = false, arrowSource = null;
var penMode = false, eraserMode = false;
var penColorIdx = 0;
var drawing = false, currentPath = null, currentPoints = [];
var eid = 0;
var sid = 0;
var canvas = document.getElementById('canvas');
var svg = document.getElementById('arrowSvg');
var drawSvg = document.getElementById('drawSvg');
var rafPending = false;
var colorPop = document.getElementById('colorPop');
var selectTool = document.getElementById('selectTool');
function buildColorPop(){
  colorPop.innerHTML = '';
  for(var i=0; i<PEN_COLORS.length; i++){
    (function(idx){
      var dot = document.createElement('div');
      dot.className = 'color-dot' + (idx === penColorIdx ? ' selected' : '');
      dot.style.background = PEN_COLORS[idx];
      if(idx === 7) dot.style.boxShadow = '0 0 0 2px #ccc, 0 1px 4px rgba(0,0,0,0.3)';
      dot.onclick = function(e){ e.stopPropagation(); selectColor(idx); };
      colorPop.appendChild(dot);
    })(i);
  }
}
function selectColor(idx){
  penColorIdx = idx;
  document.getElementById('penTool').style.borderColor = PEN_COLORS[idx];
  document.getElementById('penLabel').textContent = PEN_COLOR_NAMES[idx];
  colorPop.classList.remove('show');
  buildColorPop();
}
function updateUndoBtn(){
  var btn = document.getElementById('btnUndo');
  btn.disabled = undoStack.length === 0;
}
function loadScript(src, cb){
  var s = document.createElement('script');
  s.src = src; s.onload = cb;
  s.onerror = function(){ alert('截图组件加载失败，请检查网络'); };
  document.head.appendChild(s);
}
function isPortrait(){ return window.innerHeight > window.innerWidth; }
if(isPortrait()){
  setTimeout(function(){
    var rt = document.getElementById('rotateTip');
    rt.className = 'rotate-tip show';
    setTimeout(function(){ rt.className = 'rotate-tip'; }, 4000);
  }, 1500);
}
function onPalClick(item){
  var type = item.getAttribute('data-type');
  if(type) addElement(type, 35 + Math.random()*20, 30 + Math.random()*30);
}
function clearAllTools(){
  arrowMode = false; arrowSource = null;
  penMode = false; eraserMode = false;
  delMode = false;
  selectTool.className = 'pal-item select-tool active';
  document.getElementById('arrowTool').className = 'pal-item arrow-tool';
  document.getElementById('penTool').className = 'pal-item pen-tool';
  document.getElementById('eraserTool').className = 'pal-item eraser-tool';
  document.getElementById('btnDel').className = 'btn-del';
  document.getElementById('btnDel').textContent = '🗑 删除';
  colorPop.classList.remove('show');
}
function toggleSelectTool(){
  clearAllTools();
}
function toggleArrowTool(){
  clearAllTools();
  arrowMode = true;
  selectTool.className = 'pal-item select-tool';
  document.getElementById('arrowTool').className = 'pal-item arrow-tool active';
}
function onPenClick(){
  if(penMode){
    buildColorPop();
    colorPop.classList.toggle('show');
  } else {
    clearAllTools();
    penMode = true;
    selectTool.className = 'pal-item select-tool';
    document.getElementById('penTool').className = 'pal-item pen-tool active';
    document.getElementById('penTool').style.borderColor = PEN_COLORS[penColorIdx];
    document.getElementById('penLabel').textContent = PEN_COLOR_NAMES[penColorIdx];
    buildColorPop();
    colorPop.classList.add('show');
    setTimeout(function(){ colorPop.classList.remove('show'); }, 3000);
  }
}
function toggleEraserTool(){
  clearAllTools();
  eraserMode = true;
  selectTool.className = 'pal-item select-tool';
  document.getElementById('eraserTool').className = 'pal-item eraser-tool active';
}
function addElement(type, xPct, yPct){
  var info = CELL_INFO[type];
  var el = document.createElement('div');
  el.className = 'placed';
  el.innerHTML = '<div class="cell"><div class="' + info.cls + '">' + info.html + '</div></div><div class="name">' + info.name + '</div>';
  el.style.left = xPct + '%'; el.style.top = yPct + '%';
  canvas.appendChild(el);
  var obj = {id: ++eid, type: type, el: el, x: xPct, y: yPct, lineEl: null};
  elements.push(obj);
  undoStack.push({action:'addElement', id: obj.id});
  updateUndoBtn();
  makeDraggable(obj);
}
function getCenter(el){
  var rect = canvas.getBoundingClientRect();
  var r = el.getBoundingClientRect();
  return {x: r.left - rect.left + r.width/2, y: r.top - rect.top + r.height/2};
}
function buildSvgDefs(){
  svg.innerHTML = '<defs><marker id="ah" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><polygon points="0 0, 12 5, 0 10" fill="#2c5f2d"/></marker></defs>';
}
function drawArrows(){
  var cw = canvas.offsetWidth, ch = canvas.offsetHeight;
  svg.setAttribute('width', cw); svg.setAttribute('height', ch);
  buildSvgDefs();
  for(var i=0; i<arrows.length; i++){
    var from = findById(arrows[i].fromId);
    var to = findById(arrows[i].toId);
    if(!from || !to) continue;
    var p1 = getCenter(from.el), p2 = getCenter(to.el);
    var line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', p1.x); line.setAttribute('y1', p1.y);
    line.setAttribute('x2', p2.x); line.setAttribute('y2', p2.y);
    line.setAttribute('stroke', '#2c5f2d'); line.setAttribute('stroke-width', '3');
    line.setAttribute('marker-end', 'url(#ah)');
    svg.appendChild(line);
    from.lineEl = line;
  }
}
function updateArrowsFast(){
  if(rafPending) return;
  rafPending = true;
  requestAnimationFrame(function(){
    rafPending = false;
    for(var i=0; i<arrows.length; i++){
      var from = findById(arrows[i].fromId);
      var to = findById(arrows[i].toId);
      if(!from || !to || !from.lineEl) continue;
      var p1 = getCenter(from.el), p2 = getCenter(to.el);
      from.lineEl.setAttribute('x1', p1.x);
      from.lineEl.setAttribute('y1', p1.y);
      from.lineEl.setAttribute('x2', p2.x);
      from.lineEl.setAttribute('y2', p2.y);
    }
  });
}
function findById(id){
  for(var i=0; i<elements.length; i++){ if(elements[i].id === id) return elements[i]; }
  return null;
}
function clearArrowSourceHighlight(){
  for(var i=0; i<elements.length; i++){ elements[i].el.classList.remove('arrow-source'); }
}
function makeDraggable(obj){
  var el = obj.el;
  el.addEventListener('touchstart', function(e){
    if(e.touches.length > 1) return;
    if(penMode || eraserMode) return;
    var t = e.touches[0];
    if(delMode){ handleDelete(obj); return; }
    if(arrowMode){ handleArrowClick(obj); return; }
    dragEl = obj;
    var rect = canvas.getBoundingClientRect();
    var r = el.getBoundingClientRect();
    dragOffsetX = t.clientX - r.left;
    dragOffsetY = t.clientY - r.top;
    el.style.zIndex = 50;
    e.preventDefault();
  }, {passive:false});
  el.addEventListener('touchmove', function(e){
    if(penMode || eraserMode) return;
    if(!dragEl || dragEl.id !== obj.id) return;
    var t = e.touches[0];
    var rect = canvas.getBoundingClientRect();
    var px = t.clientX - rect.left - dragOffsetX;
    var py = t.clientY - rect.top - dragOffsetY;
    px = Math.max(20, Math.min(rect.width - 20, px));
    py = Math.max(20, Math.min(rect.height - 20, py));
    obj.x = px / rect.width * 100;
    obj.y = py / rect.height * 100;
    el.style.left = obj.x + '%';
    el.style.top = obj.y + '%';
    updateArrowsFast();
    e.preventDefault();
  }, {passive:false});
  el.addEventListener('touchend', function(){
    if(dragEl){ dragEl.el.style.zIndex=20; dragEl=null; }
  });
  el.addEventListener('mousedown', function(e){
    if(penMode || eraserMode) return;
    e.preventDefault();
    if(delMode){ handleDelete(obj); return; }
    if(arrowMode){ handleArrowClick(obj); return; }
    dragEl = obj;
    var rect = canvas.getBoundingClientRect();
    var r = el.getBoundingClientRect();
    dragOffsetX = e.clientX - r.left;
    dragOffsetY = e.clientY - r.top;
    el.style.zIndex = 50;
  });
  el.addEventListener('mousemove', function(e){
    if(penMode || eraserMode) return;
    if(!dragEl || dragEl.id !== obj.id) return;
    var rect = canvas.getBoundingClientRect();
    var px = e.clientX - rect.left - dragOffsetX;
    var py = e.clientY - rect.top - dragOffsetY;
    px = Math.max(20, Math.min(rect.width - 20, px));
    py = Math.max(20, Math.min(rect.height - 20, py));
    obj.x = px / rect.width * 100;
    obj.y = py / rect.height * 100;
    el.style.left = obj.x + '%';
    el.style.top = obj.y + '%';
    updateArrowsFast();
  });
  el.addEventListener('mouseup', function(){
    if(dragEl){ dragEl.el.style.zIndex=20; dragEl=null; }
  });
}
function handleDelete(obj){
  var na = [];
  for(var i=0; i<arrows.length; i++){ if(arrows[i].fromId!==obj.id && arrows[i].toId!==obj.id) na.push(arrows[i]); }
  arrows = na;
  obj.el.remove();
  var ne = [];
  for(var j=0; j<elements.length; j++){ if(elements[j].id!==obj.id) ne.push(elements[j]); }
  elements = ne;
  undoStack = [];
  updateUndoBtn();
  drawArrows();
}
function handleArrowClick(obj){
  if(!arrowSource){
    arrowSource = obj;
    obj.el.classList.add('arrow-source');
  } else if(arrowSource.id === obj.id){
    obj.el.classList.remove('arrow-source');
    arrowSource = null;
  } else {
    arrows.push({fromId: arrowSource.id, toId: obj.id});
    undoStack.push({action:'addArrow', fromId: arrowSource.id, toId: obj.id});
    updateUndoBtn();
    clearArrowSourceHighlight();
    arrowSource = null;
    drawArrows();
  }
}
function getCanvasPoint(clientX, clientY){
  var rect = canvas.getBoundingClientRect();
  return {x: clientX - rect.left, y: clientY - rect.top};
}
function startDraw(clientX, clientY){
  drawing = true;
  var pt = getCanvasPoint(clientX, clientY);
  currentPoints = [pt];
  currentPath = document.createElementNS('http://www.w3.org/2000/svg','path');
  currentPath.setAttribute('d', 'M' + pt.x + ',' + pt.y);
  currentPath.setAttribute('stroke', PEN_COLORS[penColorIdx]);
  currentPath.setAttribute('stroke-width', '3');
  currentPath.setAttribute('fill', 'none');
  currentPath.setAttribute('stroke-linecap', 'round');
  currentPath.setAttribute('stroke-linejoin', 'round');
  drawSvg.appendChild(currentPath);
}
function moveDraw(clientX, clientY){
  if(!drawing || !currentPath) return;
  var pt = getCanvasPoint(clientX, clientY);
  currentPoints.push(pt);
  var d = 'M' + currentPoints[0].x + ',' + currentPoints[0].y;
  for(var i=1; i<currentPoints.length; i++){
    d += ' L' + currentPoints[i].x + ',' + currentPoints[i].y;
  }
  currentPath.setAttribute('d', d);
}
function endDraw(){
  if(!drawing) return;
  drawing = false;
  if(currentPath && currentPoints.length > 1){
    var stroke = {id: ++sid, path: currentPath};
    strokes.push(stroke);
    undoStack.push({action:'addStroke', id: stroke.id});
    updateUndoBtn();
  } else if(currentPath){
    currentPath.remove();
  }
  currentPath = null;
  currentPoints = [];
}
function eraseAt(clientX, clientY){
  var pt = getCanvasPoint(clientX, clientY);
  var r = 25;
  for(var i=strokes.length - 1; i >= 0; i--){
    var p = strokes[i].path;
    try{
      var bbox = p.getBBox();
      if(pt.x >= bbox.x - r && pt.x <= bbox.x + bbox.width + r &&
         pt.y >= bbox.y - r && pt.y <= bbox.y + bbox.height + r){
        p.remove();
        strokes.splice(i, 1);
        break;
      }
    }catch(e){}
  }
}
canvas.addEventListener('touchstart', function(e){
  if(penMode){
    e.preventDefault();
    colorPop.classList.remove('show');
    var t = e.touches[0];
    startDraw(t.clientX, t.clientY);
  } else if(eraserMode){
    e.preventDefault();
    var t2 = e.touches[0];
    eraseAt(t2.clientX, t2.clientY);
  }
}, {passive:false});
canvas.addEventListener('touchmove', function(e){
  if(penMode){
    e.preventDefault();
    var t = e.touches[0];
    moveDraw(t.clientX, t.clientY);
  } else if(eraserMode){
    e.preventDefault();
    var t2 = e.touches[0];
    eraseAt(t2.clientX, t2.clientY);
  }
}, {passive:false});
canvas.addEventListener('touchend', function(e){
  if(penMode){ e.preventDefault(); endDraw(); }
}, {passive:false});
canvas.addEventListener('mousedown', function(e){
  if(penMode){ e.preventDefault(); colorPop.classList.remove('show'); startDraw(e.clientX, e.clientY); }
  else if(eraserMode){ e.preventDefault(); eraseAt(e.clientX, e.clientY); }
});
canvas.addEventListener('mousemove', function(e){
  if(penMode){ moveDraw(e.clientX, e.clientY); }
  else if(eraserMode && (e.buttons & 1)){ eraseAt(e.clientX, e.clientY); }
});
canvas.addEventListener('mouseup', function(e){
  if(penMode){ endDraw(); }
});
canvas.addEventListener('mouseleave', function(e){
  if(penMode){ endDraw(); }
});
function undoLast(){
  if(undoStack.length === 0) return;
  var action = undoStack.pop();
  if(action.action === 'addElement'){
    var el = findById(action.id);
    if(el){
      var na = [];
      for(var i=0; i<arrows.length; i++){ if(arrows[i].fromId!==el.id && arrows[i].toId!==el.id) na.push(arrows[i]); }
      arrows = na;
      el.el.remove();
      var ne = [];
      for(var j=0; j<elements.length; j++){ if(elements[j].id!==el.id) ne.push(elements[j]); }
      elements = ne;
    }
  } else if(action.action === 'addArrow'){
    var na2 = [];
    for(var k=0; k<arrows.length; k++){
      if(!(arrows[k].fromId===action.fromId && arrows[k].toId===action.toId)) na2.push(arrows[k]);
    }
    arrows = na2;
  } else if(action.action === 'addStroke'){
    for(var m=0; m<strokes.length; m++){
      if(strokes[m].id === action.id){
        strokes[m].path.remove();
        strokes.splice(m, 1);
        break;
      }
    }
  }
  updateUndoBtn();
  drawArrows();
}
function toggleDel(){
  clearAllTools();
  delMode = true;
  var btn = document.getElementById('btnDel');
  btn.className='btn-del active';
  btn.textContent='✅ 退出删除';
}
function resetAll(){
  for(var i=0; i<elements.length; i++) elements[i].el.remove();
  for(var j=0; j<strokes.length; j++) strokes[j].path.remove();
  elements = []; arrows = []; undoStack = []; strokes = [];
  drawSvg.innerHTML = '';
  updateUndoBtn();
  drawArrows();
}
function checkModel(){
  var allOk = true;
  var keys = Object.keys(TARGETS);
  for(var i=0; i<keys.length; i++){
    var type = keys[i], placed = [];
    for(var j=0; j<elements.length; j++){ if(elements[j].type===type) placed.push(elements[j]); }
    if(placed.length === 0){ allOk = false; continue; }
    var o = placed[0];
    var dx = Math.abs(o.x - TARGETS[type].x), dy = Math.abs(o.y - TARGETS[type].y);
    if(dx > 15 || dy > 18){ allOk = false; }
  }
  var byType = {};
  for(var k=0; k<elements.length; k++){ if(!byType[elements[k].type]) byType[elements[k].type] = elements[k]; }
  for(var m=0; m<REQUIRED_ARROWS.length; m++){
    var ra = REQUIRED_ARROWS[m];
    var fromEl = byType[ra.from], toEl = byType[ra.to];
    if(!fromEl || !toEl) continue;
    var hasArrow = false;
    for(var n=0; n<arrows.length; n++){
      if(arrows[n].fromId===fromEl.id && arrows[n].toId===toEl.id){ hasArrow=true; break; }
    }
    if(!hasArrow){ allOk = false; }
  }
  return allOk;
}
function hideFb(){ document.getElementById('feedback').className='feedback'; }
function showSubmitModal(){
  document.getElementById('submitModal').className='submit-modal show';
  setTimeout(function(){ document.getElementById('studentName').focus(); }, 100);
}
function closeSubmitModal(){ document.getElementById('submitModal').className='submit-modal'; }
function doSubmit(){
  var name = document.getElementById('studentName').value.trim();
  if(!name){ alert('请输入你的姓名'); return; }
  var passed = checkModel();
  var btn = document.getElementById('sendBtn');
  btn.textContent = '截图中...'; btn.disabled = true;
  hideFb();
  function onDone(imgUrl){
    btn.textContent = '发送中...';
    var urlText = imgUrl ? imgUrl : '（截图上传失败，请课堂查看）';
    var payload = {
      name: name,
      _subject: '【生物作业】' + name + '的体液免疫模型' + (passed ? ' ✅正确' : ' ❌有误'),
      _template: 'table',
      '学生姓名': name,
      '检查结果': passed ? '✅ 完全正确' : '❌ 有错误',
      '细胞数': String(elements.length),
      '箭头数': String(arrows.length),
      '模型截图': urlText
    };
    var xhr = new XMLHttpRequest();
    xhr.open('POST', 'https://formsubmit.co/ajax/2507166891@qq.com', true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.setRequestHeader('Accept', 'application/json');
    xhr.timeout = 15000;
    xhr.onload = function(){
      btn.textContent = '提交'; btn.disabled = false;
      closeSubmitModal();
      var box = document.getElementById('submitBox');
      box.innerHTML = '<div class="submit-ok"><div class="big">✅</div><h3>提交成功！</h3><p style="font-size:0.85rem;color:#666;margin-top:8px">' + name + '，结果已发送给老师</p></div>';
      setTimeout(function(){
        box.innerHTML = '<h3>📤 提交你的答案</h3><p style="font-size:0.8rem;color:#888;margin-bottom:12px">提交后老师会收到你的模型截图</p><input type="text" id="studentName" placeholder="输入你的姓名" maxlength="20"><div class="btn-row"><button class="btn-cancel" onclick="closeSubmitModal()">取消</button><button class="btn-send" id="sendBtn" onclick="doSubmit()">提交</button></div>';
      }, 2500);
    };
    xhr.onerror = function(){ btn.textContent = '提交'; btn.disabled = false; alert('邮件发送失败，请重试'); };
    xhr.ontimeout = function(){ btn.textContent = '提交'; btn.disabled = false; alert('发送超时，请重试'); };
    xhr.send(JSON.stringify(payload));
  }
  function proceed(){
    try {
      html2canvas(canvas, {backgroundColor:'#ffffff', scale:2, useCORS:true, logging:false}).then(function(canvasImg){
        btn.textContent = '上传图片...';
        canvasImg.toBlob(function(blob){
          var fd = new FormData();
          fd.append('reqtype', 'fileupload');
          fd.append('time', '24h');
          fd.append('fileToUpload', blob, 'model.png');
          var up = new XMLHttpRequest();
          up.open('POST', 'https://litterbox.catbox.moe/resources/internals/api.php', true);
          up.timeout = 20000;
          up.onload = function(){
            var url = '';
            if(up.status === 200 && up.responseText.indexOf('http') === 0) url = up.responseText.trim();
            onDone(url);
          };
          up.onerror = function(){ onDone(''); };
          up.ontimeout = function(){ onDone(''); };
          up.send(fd);
        }, 'image/png');
      }).catch(function(e){ onDone(''); });
    } catch(e) { onDone(''); }
  }
  if(typeof html2canvas === 'undefined'){
    loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js?v=13', proceed);
  } else { proceed(); }
}
window.addEventListener('resize', function(){ drawArrows(); });
window.addEventListener('orientationchange', function(){ setTimeout(drawArrows, 300); });
</script>
