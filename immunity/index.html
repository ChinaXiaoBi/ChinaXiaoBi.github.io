<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>体液免疫交互模型 · 高中生物选必1</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#fff;color:#333;display:flex;flex-direction:column}
.header{background:linear-gradient(135deg,#2c5f2d,#4a8c4a);color:#fff;padding:8px 12px;text-align:center;flex-shrink:0;z-index:10}
.header h1{font-size:1rem;font-weight:700}
.header p{font-size:0.7rem;opacity:0.85;margin-top:2px}
.main{flex:1;display:flex;overflow:hidden;position:relative}
.palette{width:120px;background:#f7f9f4;border-right:2px solid #d8e0d0;padding:8px;overflow-y:auto;flex-shrink:0;z-index:5}
.palette h3{font-size:0.7rem;color:#777;margin-bottom:8px;text-align:center;letter-spacing:1px}
.pal-item{display:flex;align-items:center;gap:6px;padding:6px;margin-bottom:5px;background:#fff;border:2px solid #d0d8c8;border-radius:8px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-size:0.72rem;transition:transform .1s,box-shadow .1s}
.pal-item:active{transform:scale(0.95);cursor:grabbing}
.pal-item:hover{border-color:#4a8c4a;box-shadow:0 2px 8px rgba(74,140,74,0.2)}
.pal-item .pic{width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.canvas{flex:1;position:relative;overflow:hidden;background:#fff;background-image:radial-gradient(circle,#dde5d5 1px,transparent 1px);background-size:22px 22px;touch-action:none}
.placed{position:absolute;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;align-items:center;z-index:20;transition:filter .2s}
.placed:active{cursor:grabbing;z-index:50}
.placed .cell{width:54px;height:54px;display:flex;align-items:center;justify-content:center;position:relative}
.placed .name{font-size:0.68rem;background:rgba(255,255,255,0.92);padding:2px 6px;border-radius:4px;white-space:nowrap;margin-top:3px;border:1px solid #e0e0e0;font-weight:600;color:#444}
.placed.highlight{filter:drop-shadow(0 0 6px #ffd700)}
.virus-body{width:40px;height:40px;background:#e74c3c;border-radius:50%;position:relative;border:2px solid #c0392b}
.virus-body::before{content:'';position:absolute;inset:-6px;background:repeating-conic-gradient(from 0deg,#e74c3c 0deg 12deg,transparent 12deg 30deg);border-radius:50%;z-index:-1}
.virus-body::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:16px;height:16px;background:#c0392b;border-radius:50%}
.apc-body{width:50px;height:44px;background:#27ae60;border-radius:45% 55% 50% 50%/55% 45% 55% 45%;position:relative;border:2px solid #1e8449}
.apc-body::after{content:'';position:absolute;top:30%;left:30%;width:16px;height:12px;background:#1e8449;border-radius:50%}
.helper-body{width:44px;height:44px;background:#3498db;border-radius:50%;border:2px solid #2980b9;position:relative}
.helper-body::after{content:'';position:absolute;top:30%;left:30%;width:16px;height:16px;background:#2980b9;border-radius:50%}
.bcell-body{width:44px;height:44px;background:#f1c40f;border-radius:50%;border:2px solid #d4ac0d;position:relative}
.bcell-body::after{content:'';position:absolute;top:30%;left:30%;width:16px;height:16px;background:#d4ac0d;border-radius:50%}
.plasma-body{width:56px;height:40px;background:#9b59b6;border-radius:40% 60% 55% 45%/50% 45% 55% 50%;border:2px solid #7d3c98;position:relative}
.plasma-body::after{content:'';position:absolute;top:25%;left:20%;width:20px;height:14px;background:#7d3c98;border-radius:40%}
.memory-body{width:42px;height:42px;background:#e67e22;border-radius:50%;border:3px dashed #fff;outline:2px solid #d35400;position:relative}
.memory-body::after{content:'';position:absolute;top:30%;left:30%;width:14px;height:14px;background:#d35400;border-radius:50%}
.antibody-body{font-size:28px;line-height:1}
.arrow-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible}
.controls{padding:8px 12px;background:#f7f9f4;border-top:2px solid #d8e0d0;display:flex;gap:8px;justify-content:center;flex-shrink:0;flex-wrap:wrap;z-index:10}
.controls button{padding:10px 20px;border:none;border-radius:20px;font-size:0.88rem;cursor:pointer;font-weight:600;transition:transform .1s}
.controls button:active{transform:scale(0.95)}
.btn-check{background:#2c5f2d;color:#fff}
.btn-reset{background:#95a5a6;color:#fff}
.btn-tip{background:#2980b9;color:#fff}
.btn-del{background:#e74c3c;color:#fff}
.btn-del.active{background:#c0392b;box-shadow:0 0 0 3px rgba(231,76,60,0.3)}
.feedback{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#fff8e1;border:2px solid #ffc107;border-radius:12px;padding:12px 16px;max-width:92%;width:340px;z-index:100;display:none;box-shadow:0 4px 24px rgba(0,0,0,0.15)}
.feedback.show{display:block;animation:fbIn .3s ease}
@keyframes fbIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.feedback.ok{background:#e8f5e9;border-color:#4caf50}
.feedback h4{font-size:0.95rem;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.feedback ul{padding-left:18px;font-size:0.82rem;line-height:1.7;color:#555}
.feedback .close-fb{float:right;cursor:pointer;font-size:1.1rem;color:#999;padding:0 4px}
.feedback .close-fb:hover{color:#333}
.zone-label{position:absolute;font-size:0.65rem;color:#bbb;pointer-events:none;z-index:1}
@media(max-width:600px){
  .palette{width:96px;padding:5px}
  .pal-item{font-size:0.62rem;padding:4px;gap:4px}
  .pal-item .pic{width:22px;height:22px}
  .placed .cell{width:42px;height:42px}
  .placed .name{font-size:0.58rem}
  .virus-body{width:30px;height:30px}
  .apc-body{width:38px;height:34px}
  .helper-body,.bcell-body,.memory-body{width:34px;height:34px}
  .plasma-body{width:44px;height:30px}
  .antibody-body{font-size:22px}
  .controls button{padding:8px 14px;font-size:0.78rem}
}
</style>
</head>
<body>
<div class="header">
  <h1>🧬 体液免疫交互模型</h1>
  <p>高中生物选择性必修1 · 从左侧拖入细胞，搭建体液免疫过程</p>
</div>
<div class="main">
  <div class="palette">
    <h3>素材栏</h3>
    <div class="pal-item" data-type="virus"><span class="pic"><div class="virus-body"></div></span>诺如病毒</div>
    <div class="pal-item" data-type="apc"><span class="pic"><div class="apc-body"></div></span>抗原呈递细胞</div>
    <div class="pal-item" data-type="helperT"><span class="pic"><div class="helper-body"></div></span>辅助性T细胞</div>
    <div class="pal-item" data-type="bcell"><span class="pic"><div class="bcell-body"></div></span>B细胞</div>
    <div class="pal-item" data-type="plasma"><span class="pic"><div class="plasma-body"></div></span>浆细胞</div>
    <div class="pal-item" data-type="memory"><span class="pic"><div class="memory-body"></div></span>记忆B细胞</div>
    <div class="pal-item" data-type="antibody"><span class="pic"><div class="antibody-body">Y</div></span>抗体</div>
  </div>
  <div class="canvas" id="canvas">
    <svg class="arrow-svg" id="arrowSvg"></svg>
    <div class="feedback" id="feedback">
      <span class="close-fb" onclick="hideFb()">&times;</span>
      <h4 id="fbTitle"></h4>
      <ul id="fbList"></ul>
    </div>
  </div>
</div>
<div class="controls">
  <button class="btn-tip" id="btnTip">💡 提示</button>
  <button class="btn-del" id="btnDel">🗑 删除模式</button>
  <button class="btn-reset" id="btnReset">🔄 重置</button>
  <button class="btn-check" id="btnCheck">✅ 检查模型</button>
</div>
<script>
const CELL_INFO = {
  virus:{name:'诺如病毒',cls:'virus-body'},
  apc:{name:'抗原呈递细胞',cls:'apc-body'},
  helperT:{name:'辅助性T细胞',cls:'helper-body'},
  bcell:{name:'B细胞',cls:'bcell-body'},
  plasma:{name:'浆细胞',cls:'plasma-body'},
  memory:{name:'记忆B细胞',cls:'memory-body'},
  antibody:{name:'抗体',cls:'antibody-body'}
};
const TARGETS = {
  virus:{x:8,y:50,hint:'病毒最先入侵，应在最左侧'},
  apc:{x:25,y:50,hint:'抗原呈递细胞摄取处理病毒，紧邻病毒'},
  helperT:{x:43,y:22,hint:'辅助性T细胞接受APC呈递的抗原，在上方'},
  bcell:{x:58,y:50,hint:'B细胞接受抗原和辅助性T细胞的信号'},
  memory:{x:78,y:18,hint:'B细胞增殖分化出记忆B细胞，在右上方'},
  plasma:{x:78,y:75,hint:'B细胞增殖分化出浆细胞，在右下方'},
  antibody:{x:93,y:75,hint:'浆细胞分泌抗体，在浆细胞右侧'}
};
let elements = [];
let dragEl = null, dragOffset = {x:0,y:0};
let delMode = false;
let eid = 0;
const canvas = document.getElementById('canvas');
const svg = document.getElementById('arrowSvg');
document.querySelectorAll('.pal-item').forEach(item=>{
  item.addEventListener('pointerdown',e=>{
    e.preventDefault();
    const type = item.dataset.type;
    addElement(type, 50, 45);
  });
});
function addElement(type,xPct,yPct){
  const info = CELL_INFO[type];
  const el = document.createElement('div');
  el.className = 'placed';
  el.innerHTML = `<div class="cell"><div class="${info.cls}"></div></div><div class="name">${info.name}</div>`;
  el.style.left = xPct+'%';
  el.style.top = yPct+'%';
  canvas.appendChild(el);
  const obj = {id:++eid,type,el,x:xPct,y:yPct};
  elements.push(obj);
  makeDraggable(obj);
}
function makeDraggable(obj){
  const el = obj.el;
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();
    e.stopPropagation();
    if(delMode){
      el.remove();
      elements = elements.filter(x=>x.id!==obj.id);
      return;
    }
    dragEl = obj;
    const rect = canvas.getBoundingClientRect();
    const elRect = el.getBoundingClientRect();
    dragOffset.x = e.clientX - elRect.left;
    dragOffset.y = e.clientY - elRect.top;
    el.setPointerCapture(e.pointerId);
    el.style.zIndex = 50;
  });
  el.addEventListener('pointermove',e=>{
    if(!dragEl||dragEl.id!==obj.id)return;
    const rect = canvas.getBoundingClientRect();
    let px = e.clientX - rect.left - dragOffset.x;
    let py = e.clientY - rect.top - dragOffset.y;
    px = Math.max(0, Math.min(rect.width - el.offsetWidth, px));
    py = Math.max(0, Math.min(rect.height - el.offsetHeight, py));
    obj.x = px / rect.width * 100;
    obj.y = py / rect.height * 100;
    el.style.left = obj.x+'%';
    el.style.top = obj.y+'%';
  });
  el.addEventListener('pointerup',e=>{
    if(dragEl){dragEl.el.style.zIndex=20;dragEl=null;}
  });
  el.addEventListener('pointercancel',()=>{
    if(dragEl){dragEl.el.style.zIndex=20;dragEl=null;}
  });
}
document.getElementById('btnDel').addEventListener('click',function(){
  delMode = !delMode;
  this.classList.toggle('active',delMode);
  this.textContent = delMode ? '✅ 退出删除' : '🗑 删除模式';
});
document.getElementById('btnReset').addEventListener('click',()=>{
  elements.forEach(o=>o.el.remove());
  elements = [];
  hideFb();
});
document.getElementById('btnTip').addEventListener('click',()=>{
  for(const[type,t]of Object.entries(TARGETS)){
    const existing = elements.find(o=>o.type===type);
    if(!existing){
      const el = document.createElement('div');
      el.className='zone-label';
      el.style.left=t.x+'%';
      el.style.top=t.y+'%';
      el.style.transform='translate(-50%,-50%)';
      el.textContent='📍'+CELL_INFO[type].name;
      el.id='tip-'+type;
      canvas.appendChild(el);
      setTimeout(()=>{const t2=document.getElementById('tip-'+type);if(t2)t2.remove()},3000);
    }
  }
});
document.getElementById('btnCheck').addEventListener('click',checkModel);
function checkModel(){
  const results = [];
  let allOk = true;
  for(const[type,t]of Object.entries(TARGETS)){
    const placed = elements.filter(o=>o.type===type);
    if(placed.length===0){
      results.push({type,ok:false,msg:`❌ 缺少【${CELL_INFO[type].name}】——${t.hint}`});
      allOk = false;
      continue;
    }
    const o = placed[0];
    const dx = Math.abs(o.x - t.x);
    const dy = Math.abs(o.y - t.y);
    if(dx <= 14 && dy <= 16){
      results.push({type,ok:true,msg:`✅ ${CELL_INFO[type].name}位置正确`});
    } else {
      results.push({type,ok:false,msg:`⚠️ 【${CELL_INFO[type].name}】位置不对——${t.hint}`});
      allOk = false;
    }
  }
  const byType = {};
  elements.forEach(o=>{if(!byType[o.type])byType[o.type]=o});
  if(byType.virus && byType.apc && byType.apc.x < byType.virus.x){
    results.push({type:'order',ok:false,msg:'⚠️ 诺如病毒应在抗原呈递细胞之前（左侧）'});
    allOk=false;
  }
  if(byType.apc && byType.helperT && byType.helperT.x < byType.apc.x){
    results.push({type:'order2',ok:false,msg:'⚠️ 辅助性T细胞应在抗原呈递细胞之后'});
    allOk=false;
  }
  if(byType.bcell && byType.plasma && byType.plasma.x < byType.bcell.x){
    results.push({type:'order3',ok:false,msg:'⚠️ 浆细胞应由B细胞分化而来，应在B细胞右侧'});
    allOk=false;
  }
  if(byType.plasma && byType.antibody && byType.antibody.x < byType.plasma.x){
    results.push({type:'order4',ok:false,msg:'⚠️ 抗体由浆细胞分泌，应在浆细胞右侧'});
    allOk=false;
  }
  showFb(allOk, results);
}
function showFb(ok, results){
  const fb = document.getElementById('feedback');
  const title = document.getElementById('fbTitle');
  const list = document.getElementById('fbList');
  fb.className = 'feedback show ' + (ok?'ok':'');
  title.innerHTML = ok ? '🎉 恭喜！体液免疫模型搭建完全正确！' : '📋 检查结果：';
  list.innerHTML = '';
  results.forEach(r=>{
    const li = document.createElement('li');
    li.textContent = r.msg;
    list.appendChild(li);
  });
  if(ok){
    const tip = document.createElement('li');
    tip.style.marginTop='6px';
    tip.style.color='#2c5f2d';
    tip.innerHTML = '<b>正确流程：</b>诺如病毒→抗原呈递细胞→辅助性T细胞→B细胞→分化为浆细胞和记忆B细胞→浆细胞产生抗体→抗体结合病毒';
    list.appendChild(tip);
  }
}
function hideFb(){document.getElementById('feedback').className='feedback'}
window.hideFb = hideFb;
</script>
</body>
</html>
